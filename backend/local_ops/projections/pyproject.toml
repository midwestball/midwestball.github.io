[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midwestball-projection-ops"
version = "1.0.0"
description = "Deletion-safe weekly fantasy projection operations"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib==1.5.2",
  "jsonschema==4.25.1",
  "lightgbm==4.6.0",
  "nflreadpy==0.1.5",
  "pandas==2.3.2",
  "numpy==2.2.6",
  "polars==1.33.1",
  "pyarrow==21.0.0",
  "python-dotenv==1.2.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "supabase==2.18.1",
]

[dependency-groups]
test = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/projection_ops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

# Formatting only. Lint rules are deliberately left to the reader's judgement: the
# model pipeline uses dense numeric expressions that read worse when split up.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
docstring-code-format = false
